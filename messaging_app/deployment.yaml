apiVersion: v1
kind: Namespace
metadata:
  name: messaging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: messaging-app-config
  namespace: messaging
data:
  DJANGO_SETTINGS_MODULE: messaging_app.settings
  DJANGO_ALLOWED_HOSTS: "*"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-app
  namespace: messaging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: messaging-app
  template:
    metadata:
      labels:
        app: messaging-app
        version: blue
    spec:
      containers:
        - name: messaging-app
          image: moderntech/messaging-app:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DJANGO_SETTINGS_MODULE
              valueFrom:
                configMapKeyRef:
                  name: messaging-app-config
                  key: DJANGO_SETTINGS_MODULE
            - name: DJANGO_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: messaging-app-config
                  key: DJANGO_ALLOWED_HOSTS
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: messaging-app
  namespace: messaging
spec:
  selector:
    app: messaging-app
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
