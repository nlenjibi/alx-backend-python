version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python3 manage.py migrate && python3 manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-messaging_root_pass}
      MYSQL_DATABASE: ${MYSQL_DB:-messaging_app}
      MYSQL_USER: ${MYSQL_USER:-messaging_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-messaging_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD:-messaging_root_pass} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
    driver: local
